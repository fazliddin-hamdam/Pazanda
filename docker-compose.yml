services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ovqatbot
      # Parolni .env (loyiha ildizida) yoki muhit o'zgaruvchisida bering: POSTGRES_PASSWORD=...
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD o'rnatilmagan}
      POSTGRES_DB: ovqatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovqatbot"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ovqatbot:${POSTGRES_PASSWORD}@db:5432/ovqatbot
    ports:
      # Faqat shu kompyuterdan; tashqariga reverse proxy yoki tunnel orqali chiqaring
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./backend
    command: ["python", "bot.py"]
    env_file: ./backend/.env
    depends_on:
      - api
    profiles: ["bot"]

volumes:
  pgdata:
